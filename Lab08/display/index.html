<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab08 - Traffic signs for camera</title><style>body{font:18px system-ui,sans-serif;text-align:center;background:#101827;color:white;margin:0}main{max-width:800px;margin:auto;padding:1em}img{display:block;object-fit:contain;width:min(88vw,65vh,650px);height:min(88vw,65vh,650px);margin:auto;background:white}button{padding:.8em 1.5em;margin:.4em;font-size:1em;cursor:pointer;border-radius:10px}small{color:#ccd5dd}label{display:block;margin:.5em}</style></head><body><main><h2>Traffic sign camera test</h2><img id="sign" alt="Traffic sign"><h3 id="name"></h3><small id="info"></small><p><button onclick="move(-1)">← Previous</button><button onclick="move(1)">Next →</button></p><p><small>These are schematic illustrations of the same 20 GTSRB classes used in the FPGA batch; they are not the original test photographs. Live-camera accuracy may differ.</small></p></main><script>const items=[{"number":1,"class_id":0,"csv_index":10406,"label":"20 km/h","image":"01_class_00_csv_10406.svg"},{"number":2,"class_id":1,"csv_index":2335,"label":"30 km/h","image":"02_class_01_csv_02335.svg"},{"number":3,"class_id":2,"csv_index":419,"label":"50 km/h","image":"03_class_02_csv_00419.svg"},{"number":4,"class_id":3,"csv_index":8977,"label":"60 km/h","image":"04_class_03_csv_08977.svg"},{"number":5,"class_id":4,"csv_index":4758,"label":"70 km/h","image":"05_class_04_csv_04758.svg"},{"number":6,"class_id":5,"csv_index":5877,"label":"80 km/h","image":"06_class_05_csv_05877.svg"},{"number":7,"class_id":7,"csv_index":1065,"label":"100 km/h","image":"07_class_07_csv_01065.svg"},{"number":8,"class_id":8,"csv_index":4787,"label":"120 km/h","image":"08_class_08_csv_04787.svg"},{"number":9,"class_id":9,"csv_index":8466,"label":"No overtaking","image":"09_class_09_csv_08466.svg"},{"number":10,"class_id":10,"csv_index":4361,"label":"No overtaking by trucks","image":"10_class_10_csv_04361.svg"},{"number":11,"class_id":11,"csv_index":10448,"label":"Priority at next intersection","image":"11_class_11_csv_10448.svg"},{"number":12,"class_id":12,"csv_index":9448,"label":"Priority road","image":"12_class_12_csv_09448.svg"},{"number":13,"class_id":13,"csv_index":8920,"label":"Give way","image":"13_class_13_csv_08920.svg"},{"number":14,"class_id":14,"csv_index":11315,"label":"STOP","image":"14_class_14_csv_11315.svg"},{"number":15,"class_id":17,"csv_index":8710,"label":"No entry","image":"15_class_17_csv_08710.svg"},{"number":16,"class_id":18,"csv_index":2425,"label":"General danger","image":"16_class_18_csv_02425.svg"},{"number":17,"class_id":20,"csv_index":11536,"label":"Double bend","image":"17_class_20_csv_11536.svg"},{"number":18,"class_id":25,"csv_index":8166,"label":"Road works","image":"18_class_25_csv_08166.svg"},{"number":19,"class_id":33,"csv_index":1057,"label":"Turn right ahead","image":"19_class_33_csv_01057.svg"},{"number":20,"class_id":35,"csv_index":3700,"label":"Ahead only","image":"20_class_35_csv_03700.svg"}];let i=0;function show(){const x=items[i];document.getElementById("sign").src=x.image;document.getElementById("name").textContent=x.label;document.getElementById("info").textContent=(i+1)+"/"+items.length+" · GTSRB class "+x.class_id+" · test CSV row "+x.csv_index;}function move(d){i=(i+d+items.length)%items.length;show()}document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)});show();</script></body></html>
